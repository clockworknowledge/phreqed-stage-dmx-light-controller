[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phreqed-stage-dmx-light-controller"
version = "0.2.0"
description = "Layered procedural Art-Net visual engine for two Betopper LF4808 fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "clockworKnowledge" }]
dependencies = []

[project.scripts]
phreqed-dmx = "phreqed_dmx.app:main"

[tool.setuptools.packages.find]
where = ["src"]
