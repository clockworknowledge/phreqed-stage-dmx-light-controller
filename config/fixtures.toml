[controller]
artnet_host = "127.0.0.1"
artnet_port = 6454
universe = 0
fps = 25

# The LF4808 152-channel manual maps channels 1-144 to 48 RGB zones and
# channels 145-152 to eight linearly dimmed white zones. Normal show rendering
# keeps every white zone at zero until the physical zone order is commissioned.

[[fixtures]]
name = "Cube A"
start_address = 1
channel_count = 152
width = 12
height = 4
channels_per_pixel = 3
white_zone_count = 8
horizontal_order = "right_to_left"
vertical_order = "bottom_to_top"

